<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUST Computer Based Entry Test (CBNET)</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #FFFFFF; user-select: none; }
        
        /* ------------------ MODERN GRAPHICAL LOGIN PAGE ------------------ */
        .login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0055A5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container { 
            width: 100%;
            max-width: 460px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; 
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .login-header { 
            color: #003399; 
            font-size: 22px; 
            font-weight: 800; 
            padding-bottom: 6px; 
            text-align: center; 
            letter-spacing: -0.5px;
        }
        .nust-logo-sub { 
            text-align: center; 
            font-size: 13px; 
            color: #FF0000; 
            font-weight: 700; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #E8F8F5;
            color: #117A65;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 1px solid #A3E4D7;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #27AE60;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(39, 174, 96, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .form-group input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 2px solid #D5DBDB; 
            border-radius: 8px;
            font-size: 15px; 
            outline: none; 
            transition: all 0.25s ease;
            color: #333;
            background: #FAFAFA;
        }
        .form-group input:focus { 
            background: #FFFFFF; 
            border-color: #0055A5; 
            box-shadow: 0 0 0 4px rgba(0, 85, 165, 0.15);
        }
        
        .password-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        .password-wrapper input { padding-right: 65px; }
        
        .toggle-password-btn { 
            position: absolute; 
            right: 10px; 
            background: #E5E7E9; 
            border: none; 
            font-size: 11px; 
            font-weight: 700; 
            padding: 5px 9px; 
            cursor: pointer; 
            color: #444; 
            border-radius: 4px;
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .toggle-password-btn:hover { background: #BDC3C7; }

        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #0055A5, #003399); 
            color: white; 
            border: none;
            border-radius: 8px;
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 51, 153, 0.3);
        }
        .login-btn:hover { 
            background: linear-gradient(135deg, #003399, #002266);
            transform: scale(1.01);
            box-shadow: 0 6px 15px rgba(0, 51, 153, 0.4);
        }

        .instructions-box { 
            width: 100%;
            max-width: 460px; 
            margin-top: 20px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 15px; 
            font-size: 12px; 
            color: #E5E7E9; 
            line-height: 1.5; 
        }

        /* ------------------ RETRO EXAM INTERFACE STYLING (DEFAULT PC) ------------------ */
        .exam-interface { display: none; padding: 15px; }
        .test-table { width: 100%; border-collapse: collapse; border: 3px double #0055A5; margin-bottom: 10px; }
        .top-header-row { background: #FFFFFF; border-bottom: 2px solid #0055A5; color: #008000; font-weight: bold; padding: 6px 10px; font-size: 14px; text-transform: uppercase; }
        .stream-title { text-align: center; color: #FF0000; font-weight: bold; font-size: 13px; border-bottom: 2px solid #0055A5; padding: 5px; background: #F9F9F9; }
        
        .workspace-container { display: flex; border-bottom: 2px solid #0055A5; min-height: 360px; }
        .left-main-canvas { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #0055A5; }
        
        .question-meta-bar { background: #D4E6F1; color: #003399; font-weight: bold; font-size: 13px; padding: 5px 10px; border-bottom: 1px solid #0055A5; display: flex; justify-content: space-between; }
        .question-body-pane { padding: 20px; font-size: 15px; font-weight: bold; color: #000; min-height: 110px; border-bottom: 2px solid #0055A5; line-height: 1.6; background: #FFF; }
        
        .options-pane-title { background: #D4E6F1; color: #003399; font-weight: bold; font-size: 13px; padding: 5px 10px; border-bottom: 1px solid #0055A5; }
        .options-list-wrapper { padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; flex: 1; }
        
        .option-row-item { display: flex; align-items: center; border: 1px solid #A9CCE3; padding: 10px 15px; background: white; cursor: pointer; }
        .option-row-item:hover { background: #EBF5FB; border-color: #2980B9; }
        .option-row-item.selected { background: #D4E6F1; border: 1px solid #0055A5; font-weight: bold; }
        .option-radio-input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
        
        .right-photo-panel { width: 170px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: #FFFFFF; }
        .photo-box-frame { width: 130px; height: 150px; border: 1px solid #003399; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; font-size: 13px; color: #555; background: #FAFAFA; margin-bottom: 12px; }

        /* Retro Navigation Button Grid Block */
        .navigation-grid-wrapper { border: 1px solid #0055A5; margin: 10px 0; padding: 8px; background: #F2F4F4; display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
        .nav-square-btn { background: #E5E7E9; border: 1px solid #7F8C8D; text-align: center; font-size: 11px; padding: 5px 0; cursor: pointer; font-weight: bold; color: #000; }
        .nav-square-btn.active-focus { border: 2px solid #FF0000; background: #FFF; color: #FF0000; }
        .nav-square-btn.filled { background: #2ECC71; color: white; border-color: #27AE60; }
        .nav-square-btn.flagged-review { background: #F1C40F; color: black; border-color: #D4AC0D; }

        /* Bottom Controls Bar Styling */
        .bottom-action-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; background: #FFFFFF; }
        .timer-dashboard { display: flex; border: 1px solid #008000; background: #FFFFFF; height: 48px; align-items: center; }
        .timer-left-banner { background: #008000; color: #FFFFFF; font-size: 10px; padding: 5px; height: 100%; display: flex; flex-direction: column; justify-content: center; font-weight: bold; text-align: center; text-transform: uppercase; }
        .timer-countdown-clock { font-size: 22px; font-weight: bold; color: #008000; padding: 0 10px; font-family: monospace; min-width: 130px; text-align: center; }
        
        .finish-trigger-link { color: #003399; font-weight: bold; text-decoration: underline; cursor: pointer; font-size: 13px; }
        .finish-trigger-link:hover { color: #FF0000; }

        .button-bar-right { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .retro-control-btn { padding: 6px 12px; font-size: 12px; font-weight: bold; color: white; border: 1px solid #2471A3; cursor: pointer; border-radius: 3px; display: flex; align-items: center; }
        .btn-system { background: linear-gradient(to bottom, #3498DB, #2980B9); }
        .btn-navigational { background: linear-gradient(to bottom, #5DADE2, #2874A6); }
        .btn-review { background: linear-gradient(to bottom, #F39C12, #D35400); border-color: #B03A2E; }
        .btn-subject { background: linear-gradient(to bottom, #34495E, #2C3E50); border-color: #1A252F; }
        
        /* Modal Results Layout */
        .modal-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999; }
        .modal-body { background: white; border: 3px double #0055A5; padding: 25px; text-align: center; max-width: 450px; width: 90%; }
        .score-output { font-size: 38px; font-weight: bold; color: #008000; margin: 15px 0; font-family: monospace; }

        /* ------------------ 📱 DYNAMIC MOBILE RE-CONFIGURATIONS (Screens under 768px) ------------------ */
        @media (max-width: 768px) {
            .exam-interface { padding: 5px; }
            
            /* Unstack the workspace to put photo panel at the top/bottom */
            .workspace-container { flex-direction: column; }
            
            /* Remove the rigid borders since it is stacked vertically */
            .left-main-canvas { border-right: none; }
            
            /* Re-adjust the candidate profile panel to be a small horizontal strip */
            .right-photo-panel { 
                width: 100%; 
                flex-direction: row; 
                justify-content: space-between; 
                align-items: center; 
                padding: 10px; 
                background: #F4F6F6;
                border-top: 1px solid #0055A5;
            }
            .photo-box-frame { display: none; } /* Hide empty photo block on mobile to save screen height */
            .right-photo-panel div { text-align: left !important; font-size: 13px !important; width: 100%; }

            /* Compress grid navigation down to 10 columns instead of 20 so buttons stay large and easy to tap */
            .navigation-grid-wrapper { grid-template-columns: repeat(10, 1fr); gap: 5px; padding: 6px; }
            .nav-square-btn { padding: 8px 0; font-size: 13px; } /* Slightly larger touch target */

            /* Re-arrange bottom navigation buttons so they don't leak off screen */
            .bottom-action-row { flex-direction: column; gap: 12px; align-items: stretch; }
            .timer-dashboard { justify-content: center; width: 100%; }
            .finish-trigger-link { text-align: center; display: block; margin: 5px 0; font-size: 14px; }
            
            /* Make action buttons take full width grid spaces so thumbs can tap easily */
            .button-bar-right { 
                display: grid; 
                grid-template-columns: repeat(2, 1fr); 
                gap: 6px; 
                width: 100%; 
            }
            .retro-control-btn { 
                justify-content: center; 
                padding: 12px 6px; 
                font-size: 13px; 
            }
        }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreenView">
        <div class="login-container">
            <div class="status-badge">
                <div class="pulse-dot"></div>
                <span>SYSTEM STATUS: OPERATIONAL</span>
            </div>
            <div class="login-header">National University of Sciences & Technology</div>
            <div class="nust-logo-sub">Computer Based Entry Test Portal (CBNET)</div>
            
            <div class="form-group">
                <label>Candidate Roll Number / ID</label>
                <input type="text" id="candidateIdInput" placeholder="e.g., NUST-786-ICS">
            </div>
            <div class="form-group">
                <label>Access Password</label>
                <div class="password-wrapper">
                    <input type="password" id="candidatePassInput" placeholder="Enter password">
                    <button type="button" class="toggle-password-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility()">Show</button>
                </div>
            </div>
            
            <button class="login-btn" onclick="authenticateUserLogin()">Login & Start Assessment</button>
        </div>
        <div class="instructions-box">
            <b style="color: #FFD700; font-size: 13px;">Important System Instructions:</b><br>
            • Total Test duration is exactly 180 minutes.<br>
            • The test pattern contains Mathematics (100), Physics (60), and English (40).<br
